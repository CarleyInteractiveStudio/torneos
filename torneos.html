<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneos - FF ARENA RD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">FF <span>ARENA</span> RD</div>
            <nav id="main-nav">
                <a href="index.html">Inicio</a>
                <a href="torneos.html">Torneos</a>
                <a href="perfil.html" id="nav-profile" class="hidden">Mi Perfil</a>
                <a href="admin.html" id="nav-admin" class="hidden">Admin</a>
            </nav>
        </header>

        <section style="margin-top: 40px;">
            <h2 style="font-size: 32px; font-style: italic; border-left: 5px solid var(--primary); padding-left: 15px; margin-bottom: 30px;">TORNEOS ACTIVOS</h2>
            <div id="tournament-list" class="grid">
                <p style="color: #666;">Cargando torneos...</p>
            </div>
        </section>

        <div id="pay-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: flex; align-items: center; justify-content: center;">
            <div class="card" style="max-width: 400px; width: 90%;">
                <h2 style="color: var(--primary); margin-bottom: 20px;">INSCRIPCIÓN</h2>
                <p id="pay-torneo-name" style="margin-bottom: 10px; font-weight: bold;"></p>
                <p style="margin-bottom: 20px;">Precio: <span id="pay-monto" style="color: var(--primary);"></span> USD</p>
                <div id="paypal-button-container"></div>
                <button onclick="document.getElementById('pay-modal').classList.add('hidden')" class="btn" style="width: 100%; background: #222; margin-top: 15px;">CANCELAR</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=YOUR_CLIENT_ID&currency=USD"></script>
    <script src="js/app.js"></script>
</body>
</html>
