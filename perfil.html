<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - FF ARENA RD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">FF <span>ARENA</span> RD</div>
            <nav id="main-nav">
                <a href="index.html">Inicio</a>
                <a href="torneos.html">Torneos</a>
                <a href="#" onclick="logout()">Cerrar Sesión</a>
            </nav>
        </header>

        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin-top: 40px;">
            <div class="card" style="text-align: center;">
                <h2 id="p-nickname">Cargando...</h2>
                <p id="p-ffid" style="color: red; font-weight: bold; margin-bottom: 20px;"></p>
                <div style="background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px;">
                    <p style="font-size: 12px; color: #666;">Puntos Totales</p>
                    <h3 id="p-puntos" style="font-size: 32px; color: white;">0</h3>
                </div>
            </div>

            <div class="card">
                <h2 style="margin-bottom: 20px;">RANKING</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Guerrero</th>
                            <th style="text-align: right;">Puntos</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-table"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
</body>
</html>
